# Release builds, run from a v* tag: GITHUB_TOKEN=$(gh auth token) goreleaser release --clean
# Try it locally: goreleaser release --snapshot --clean (writes dist/).
version: 2

project_name: hl

before:
  hooks:
    - go test ./...

builds:
  - id: hl
    main: ./cmd/hl
    binary: hl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/DeM-Conve/project__hl/internal/version.Version=v{{ .Version }}
      - -X github.com/DeM-Conve/project__hl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/DeM-Conve/project__hl/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: hl
    formats: [tar.gz]
    # hl_0.1.0_linux_amd64.tar.gz; install.sh relies on this name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  abbrev: 7
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: DeM-Conve
    name: project__hl
  draft: false
  prerelease: auto

