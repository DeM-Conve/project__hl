# Release builds, run locally from a v* tag (full steps: RELEASING.md):
#   GITHUB_TOKEN=$(gh auth token) goreleaser release --clean --release-notes dist-notes.md
# Try it without publishing anything: goreleaser release --snapshot --clean (writes dist/).
# Needs goreleaser v2 and syft (for the SBOMs) on PATH.
version: 2

project_name: hl

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: hl
    main: ./cmd/hl
    binary: hl
    env:
      - CGO_ENABLED=0
    # Windows isn't supported (hl drives docker compose and Unix tools).
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/DeM-Conve/project__hl/internal/version.Version=v{{ .Version }}
      - -X github.com/DeM-Conve/project__hl/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/DeM-Conve/project__hl/internal/version.Date={{ .Date }}
    # File times inside the archives come from the tagged commit.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: hl
    formats: [tar.gz]
    # hl_0.1.0_linux_amd64.tar.gz; install.sh relies on this name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  # install.sh relies on this name and on sha256.
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive (hl_0.1.0_linux_amd64.tar.gz.sbom.json), made by syft.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Only used when no --release-notes file is given; RELEASING.md uses the
# CHANGELOG.md section instead.
changelog:
  use: git
  sort: asc
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^refactor:"

release:
  github:
    owner: DeM-Conve
    name: project__hl
  draft: false
  prerelease: auto
  footer: |
    Install: `curl -fsSL https://raw.githubusercontent.com/DeM-Conve/project__hl/main/install.sh | sh`
    (or `HL_VERSION={{ .Tag }}` to pin this release). Verify a manual download with
    `sha256sum -c --ignore-missing checksums.txt`.

# Homebrew: off until the tap repo github.com/DeM-Conve/homebrew-tap exists.
# To turn it on (RELEASING.md, "Homebrew tap"):
#   1. Create the public repo DeM-Conve/homebrew-tap with a README (it must not be empty).
#   2. Create a fine-grained token with "Contents: read and write" on that repo only.
#   3. Uncomment the block below.
#   4. Release with HOMEBREW_TAP_TOKEN=<that token> in the environment.
