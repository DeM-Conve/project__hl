name: Feature request
description: Something hl should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and why hl makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The command, flag or hl.yml setting you have in mind, if any.
