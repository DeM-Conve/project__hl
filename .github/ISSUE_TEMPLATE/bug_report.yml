name: Bug report
description: Something hl does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The commands, and the relevant part of hl.yml and the app's compose file.
      render: sh
  - type: textarea
    id: version
    attributes:
      label: hl --version
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: hl doctor
      description: The full output of `hl doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Ubuntu 24.04, macOS 15 (Docker Desktop 4.x), ...
